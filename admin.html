<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Medusa Admin Panel</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body>
<section id="login" class="login-screen"><form class="login-card" onsubmit="login(event)"><h1>Medusa Admin</h1><p>Edit the website visually. Firebase-ready with local demo fallback.</p><input id="loginEmail" type="email" placeholder="Email for Firebase / optional"><input id="loginUser" placeholder="Username: admin"><input id="loginPass" type="password" placeholder="Password: 1234" required><button>Sign in</button><small id="loginError"></small></form></section>
<div id="app" class="app"><aside class="sidebar"><h2>Medusa</h2><p>Website CMS</p><nav id="nav"></nav><button class="save" onclick="saveCMS()">Save Changes</button><button onclick="window.open('index.html','_blank')">Open Website</button><button onclick="exportCMS()">Export Backup</button><button class="danger" onclick="logout()">Logout</button></aside><main><div class="topbar"><div><h1 id="pageTitle">Dashboard</h1><p id="pageDesc">Control your website content.</p></div><span id="modeBadge">Local demo</span></div><div id="content"></div></main></div><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script><script src="firebase-config.js"></script><script src="admin.js"></script></body></html>
